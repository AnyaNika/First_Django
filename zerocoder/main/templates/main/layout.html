{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'main/css/main.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background: #f8f9fa;
        }
        aside {
            min-height: 100vh;
            width: 260px;
            background: #fff;
            box-shadow: 2px 0 8px rgba(0,0,0,.05);
            position: fixed;
            left: 0;
            top: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        aside img {
            border-radius: 50%;
            margin-bottom: 1rem;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }
        aside span {
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: #2d3a4b;
        }
        aside ul {
            width: 100%;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        aside ul li {
            width: 100%;
            margin-bottom: .5rem;
        }
        aside ul li a {
            display: block;
            width: 100%;
            padding: .75rem 1rem;
            border-radius: 8px;
            color: #495057;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        aside ul li a.active,
        aside ul li a:hover {
            background: #0d6efd;
            color: #fff;
        }
        main {
            margin-left: 260px;
            padding: 2rem 2rem 2rem 2rem;
        }
        @media (max-width: 768px) {
            aside {
                position: static;
                width: 100%;
                min-height: auto;
                flex-direction: row;
                justify-content: start;
                padding: 1rem .5rem;
            }
            aside img {
                width: 60px;
                margin-bottom: 0;
                margin-right: .5rem;
            }
            aside span {
                margin-bottom: 0;
                margin-right: 1rem;
            }
            aside ul {
                flex-direction: row;
                display: flex;
                width: auto;
                margin-left: 1rem;
            }
            aside ul li {
                margin-bottom: 0;
                margin-right: .5rem;
            }
            main {
                margin-left: 0;
                padding: 1rem;
            }
        }
    </style>
    {% block title %}
    {% endblock %}
</head>
<body>
    <aside>
        <img src="{% static 'main/img/cat.png' %}" alt="котик с голубыми глазами" width="100">
        <span>CatDjango</span>
        <ul>
            <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Главная</a></li>
            <li><a href="{% url 'page2' %}" class="{% if request.resolver_match.url_name == 'page2' %}active{% endif %}">Второстепенная</a></li>
            <li><a href="{% url 'news_home' %}" class="{% if request.resolver_match.url_name == 'news_home' %}active{% endif %}">Новостная страница</a></li>
            <li><a href="{% url 'add_news' %}" class="{% if request.resolver_match.url_name == 'add_news' %}active{% endif %}">Добавить новость</a></li>
        </ul>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
