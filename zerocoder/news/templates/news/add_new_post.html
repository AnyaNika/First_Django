{% extends 'main/layout.html' %}

{% block title %}
    <title>Страница для добавления новостей</title>
{% endblock %}

{% block content %}
    <h1>Страница для добавления новостей</h1>

<div>
    <form method="post" class="p-4 rounded shadow-sm bg-light" style="max-width: 500px; margin: 40px auto;">
        {% csrf_token %}
        <h4 class="mb-4 text-center">Добавить новость</h4>

      <div class="mb-3">
       {{form.title}}
      </div>

      <div class="mb-3">
       {{form.short_description}}
      </div>

      <div class="mb-3">
        {{form.text}}
      </div>

      <div class="row mb-3">
        <div class="col">
         {{form.pub_date}}
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Добавить новость</button>
    </form>
    <p> {{error}} </p>
</div>
{% endblock %}
