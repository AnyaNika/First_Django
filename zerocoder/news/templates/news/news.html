{% extends 'main/layout.html' %}

{% block title %}
    <title>Новостная страница</title>
{% endblock %}

{% block content %}
    <h1>Новостная страница</h1>

{% for new in news %}
    <div>
        <h2>{{ new.title }}</h2>
        <h3> {{ new.author }} </h3>
        <p> {{ new.short_description }} </p>
        <p> {{ new.pub_date }} </p>
        <p> {{ new.text }} </p>
    </div>
{% endfor %}

{% endblock %}
